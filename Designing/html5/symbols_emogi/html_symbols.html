HTML Symbol Entities

Symbols or letters that are not present on your keyboard can be added to 
HTML using entities.

To add such symbols to an HTML page, you can use the entity name or the entity number 
(a decimal or a hexadecimal reference) for the symbol:

https://www.w3schools.com/html/html_symbols.asp


Emogi

What are Emojis?
Emojis look like images, but they are not.

Emojis are letters (characters) from the UTF-8 (Unicode) character set:

https://www.w3schools.com/html/html_emojis.asp

-->

<!DOCTYPE html>
<html>
	
	<head>
		<meta charset="UTF-8">
	</head>

	<body>

		<h2>&spades;</h2>


		<h2>&#128513;</h2>

	</body>
</html>
