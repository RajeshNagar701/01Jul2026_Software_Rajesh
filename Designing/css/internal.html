  <!-- 
    internal : we apply internal css in <style> h1 { color: red;}  </style>  
    -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
	<!-- html comment -->
	
	<style>
		
		/* grouping css :  css comment */
		
		h2,h3{	color:yellow;background-color:red;text-align:center }
		
		.mystyle{color:pink;background-color:green;text-align:center }
		.upper{text-transform:lowercase}
		.underline{ text-decoration:underline}
		
		#mydesign{color:skyblue;background-color:blue;text-align:right }
	
		.box{
			width:100%;
			height:100px;
			background-color:red;
		}
		
		.box h1{
			text-align:center;
			color:white;
		}
		
		h4.test{
			text-align:center;
			color:purple;
		}
	
	</style>
	
</head>
<body>
	
    <h2>Hi i am inline css</h2>
	<h2>Hi i am inline css</h2>
	<h2>Hi i am inline css</h2>
	
	<h3>Hi i am inline css</h3>
	
	<p class="mystyle upper">HI GOOD MORNING</p>
	<p class="mystyle upper underline">HI GOOD MORNING</p>
	<p class="mystyle">HI GOOD MORNING</p>
	
	<p id="mydesign">HI GOOD NIGHT</p>
	<p id="mydesign">HI GOOD NIGHT</p>
	<p id="mydesign">HI GOOD NIGHT</p>
	
	
	<div class="box">
		<h1>Hello Hi how are you </h1>
	</div>
	
	<h4 class="test">Hello Hi how are you </h4>
	<h5 class="test">Hello Hi how are you </h5>
	
	
</body>
</html>
