<html>
	
	
	<head>
		<title> My tag Page </title>
	</head>
	
	<body>
		
		<!--
		tag have 2 scope 
		1) inline
		2) block
		-->	
		
		<b>Hello</b><b>Hello</b><b>Hello</b>
		<i>Hello</i><i>Hello</i><i>Hello</i>
		<u>Hello</u><u>Hello</u><u>Hello</u>

		<img src="logo.png" width="50px" /><img src="logo.png" width="50px" />
		
		<span>Hello</span><span>Hello</span><span>Hello</span>
		
		
		<hr>
		
		<p style="background-color:red">Paragraph</p>
		<p>Paragraph</p>
		<p>Paragraph</p>

		  <li style="background-color:red">Coffee</li>
		  <li>Tea</li>
		  <li>Milk</li>
		</ul>

		<div>Div 1</div>
		<div>Div 1</div>


		<hr>

		<span style="color:red">ahmedabad</span></p>
		
		
		<hr>

		<div style="width:100px;height:100px;background-color:red">
